<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Professor Moreira — DFC — Financiamento</title><style>
:root{font-family:Arial,Helvetica,sans-serif;color:#111}*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 10% 0%,#ffcc00,transparent 28%),linear-gradient(135deg,#3c0b9c,#1536ae 57%,#d71c79)}
main{width:100%;min-height:100vh;padding:12px 16px 88px;display:flex;flex-direction:column}
.header{display:flex;justify-content:space-between;align-items:center;color:white;font-weight:900;font-size:17px;padding:3px 6px 11px;gap:10px}
.layout{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(320px,.88fr);gap:18px;align-items:start;flex:1}
.panel,.board{background:#fff;border:4px solid #ffe000;border-radius:19px;padding:24px;box-shadow:0 8px 0 #1d0c65,0 14px 30px #12074366}
.panel{min-height:calc(100vh - 160px)}
.board{position:sticky;top:12px;display:flex;flex-direction:column;gap:12px;min-height:calc(100vh - 160px)}
.board h2{font-size:clamp(19px,2vw,28px);margin:0;color:#4d14a3}
.board img{width:100%;height:auto;max-height:calc(100vh - 280px);object-fit:contain;background:#fff;border:2px solid #b9a5eb;border-radius:10px}
.board .controls{display:flex;gap:10px;flex-wrap:wrap}.board button{background:#5c20c9;color:#fff;border:0;border-radius:9px;padding:10px;font-weight:bold;cursor:pointer}
h1{color:#4910a2;font-size:clamp(28px,3vw,48px);margin:15px 0}h2{color:#4813a0;font-size:clamp(23px,2.2vw,34px);margin:8px 0 16px}
.question{font-weight:800;font-size:clamp(19px,1.7vw,27px);line-height:1.4;margin:12px 0 20px}
.pill{display:inline-block;background:#e71b60;color:white;border-radius:30px;padding:9px 14px;font-weight:900}
.options{display:grid;gap:9px}.opt{display:flex;align-items:flex-start;gap:12px;text-align:left;width:100%;background:#ebe7ff;color:#101020;border:2px solid #a489fa;border-radius:14px;padding:12px;font-size:clamp(17px,1.4vw,22px);font-weight:700;line-height:1.32;cursor:pointer}
.opt b{display:grid;place-items:center;flex:0 0 33px;height:33px;background:#5d1bd1;color:#fff;border-radius:50%}
.opt.selected{background:#fff0a0;border-color:#f2b400}.opt.correct{background:#00a94e;border-color:#006d34;color:white;box-shadow:0 0 17px #04df68}.opt.wrong{background:#e51b4e;border-color:#9e1032;color:white;box-shadow:0 0 17px #fa375b}
.opt.correct b,.opt.wrong b{background:#fff;color:#3c1685}
.confirm,.start{width:100%;padding:15px;border:0;border-radius:12px;background:#ffe600;color:#331074;font-size:20px;font-weight:900;margin-top:16px;cursor:pointer}.confirm:disabled{opacity:.45;cursor:default}
.result{font-size:21px;font-weight:900;padding:12px;border-radius:12px;margin-top:14px}.result.good{background:#d5ffe2;color:#006c31}.result.bad{background:#ffe0e7;color:#9b0029}
.explanation{background:#fff8d6;border-left:6px solid #f8bb13;border-radius:12px;margin-top:16px;padding:16px;font-size:clamp(16px,1.2vw,20px);line-height:1.5}.explanation p{margin:9px 0}.explanation strong{color:#46119a}
.theory{font-size:clamp(17px,1.35vw,21px);line-height:1.5;padding-left:28px}.theory li{margin:11px 0}
.note{color:#5c5271;font-size:15px}.nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:14px;background:#200b72f5;border-top:3px solid #ffe600;padding:11px}.nav button{border:0;border-radius:11px;padding:12px 24px;background:#ffe600;color:#270b70;font-size:18px;font-weight:900;cursor:pointer}.nav button:last-child{background:#0dd461;color:#063a1b}.nav button:nth-child(2){background:#ed225c;color:white}.nav button:disabled{opacity:.35}
@media(max-width:900px){main{padding:10px 10px 85px}.layout{grid-template-columns:1fr}.panel{min-height:auto;padding:17px}.board{position:static;min-height:auto;padding:14px}.board img{max-height:420px}.header{font-size:13px}.nav button{font-size:15px;padding:12px 13px}}

/* Lousa interativa do professor */
.draw-toolbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:7px;flex-wrap:wrap;background:#fff;border:3px solid #ffe000;border-radius:12px;padding:8px;margin-bottom:12px;box-shadow:0 4px 12px #150b5066}
.draw-toolbar button,.draw-toolbar select{font:700 14px Arial;border:2px solid #8b73ca;border-radius:8px;background:#f2edff;color:#271055;padding:8px 10px;cursor:pointer}
.draw-toolbar button.active{background:#4c16bd;color:#fff;border-color:#ffca00}
.draw-toolbar .swatch{width:33px;height:33px;padding:0;border:2px solid #777;border-radius:50%;background:var(--swatch)}
.draw-toolbar .swatch.active{outline:3px solid #ffcc00;outline-offset:2px}
.draw-toolbar label{font:700 14px Arial;color:#281052;display:flex;align-items:center;gap:5px}
.draw-toolbar input[type=range]{width:95px;accent-color:#5724c4}
.layout{position:relative;isolation:isolate}
#inkLayer{position:absolute;inset:0;width:100%;height:100%;z-index:12;pointer-events:none;touch-action:none}
#inkLayer.drawing{pointer-events:auto;cursor:crosshair}
@media(max-width:900px){.draw-toolbar{position:relative}.draw-toolbar button{font-size:13px;padding:7px}}
</style></head>

<script>
const questions=[{"q": "Qual recebimento é classificado como atividade de financiamento?", "opts": ["Venda de mercadorias", "Emissão de ações pela entidade", "Venda de máquina usada", "Recebimento de clientes"], "correct": 1, "why": ["Venda de mercadorias é recebimento operacional.", "A emissão de ações capta recursos dos proprietários, constituindo financiamento.", "Venda de imobilizado é investimento.", "Recebimento de clientes é operacional."]}, {"q": "O pagamento para resgatar ações próprias é fluxo de:", "opts": ["Investimento", "Operacional", "Financiamento", "Equivalentes de caixa"], "correct": 2, "why": ["Investimento envolve ativos de longo prazo e aplicações em outras entidades.", "Operacional envolve as atividades geradoras de receita.", "A recompra ou resgate de ações próprias devolve recursos aos investidores: financiamento.", "Há saída efetiva de caixa, que deve aparecer na DFC."]}, {"q": "O caixa obtido com a emissão de debêntures representa:", "opts": ["Financiamento", "Investimento", "Operacional", "Transação sem caixa"], "correct": 0, "why": ["A emissão de debêntures capta recursos de terceiros: financiamento.", "Não se trata de compra ou venda de ativos de investimento.", "Não decorre de vendas ou serviços usuais.", "A questão informa entrada de caixa, logo não é transação sem caixa."]}, {"q": "O pagamento do principal de empréstimo bancário contraído deve ser classificado como:", "opts": ["Operacional", "Investimento", "Financiamento", "Ajuste sem caixa"], "correct": 2, "why": ["O pagamento do principal de dívida não é atividade operacional.", "Não corresponde à aquisição ou alienação de ativo de investimento.", "A amortização do principal reduz recursos captados e é financiamento.", "O pagamento movimenta caixa."]}, {"q": "O pagamento pelo arrendatário para reduzir o passivo de arrendamento é:", "opts": ["Operacional", "Financiamento", "Investimento", "Receita financeira"], "correct": 1, "why": ["Não é pagamento a fornecedores por bens e serviços.", "A parcela que reduz o passivo de arrendamento é financiamento, conforme item 17(e).", "Não se confunde com a aquisição à vista de um imobilizado.", "É pagamento de passivo, não receita."]}, {"q": "Qual das operações representa entrada de caixa de financiamento?", "opts": ["Pagamento de salários", "Aquisição de software", "Recebimento pela venda de estoques", "Captação de empréstimo de longo prazo"], "correct": 3, "why": ["Salários pagos são operacionais.", "Compra de intangível é investimento.", "Vendas de estoques são operacionais.", "O ingresso do empréstimo representa captação de recursos de terceiros."]}, {"q": "Uma companhia recebeu R$ 200.000 pela emissão de ações e R$ 90.000 por serviços prestados. Qual entrada pertence ao financiamento?", "opts": ["R$ 90.000", "R$ 110.000", "R$ 200.000", "R$ 290.000"], "correct": 2, "why": ["Serviços prestados geram recebimento operacional.", "Não há fundamento para calcular a diferença entre as entradas.", "Os R$ 200.000 da emissão de ações constituem financiamento.", "A soma inclui recebimento operacional e não é só financiamento."]}, {"q": "Uma empresa pagou R$ 40.000 do principal de empréstimo e R$ 25.000 a fornecedores. Qual saída é de financiamento?", "opts": ["R$ 25.000", "R$ 40.000", "R$ 65.000", "Nenhuma"], "correct": 1, "why": ["Fornecedores são operacionais.", "A amortização de R$ 40.000 do principal do empréstimo é financiamento.", "A soma mistura fluxos operacionais e de financiamento.", "Existe uma saída de financiamento identificável."]}, {"q": "Qual conjunto contém somente atividades de financiamento?", "opts": ["Emissão de debêntures e amortização de empréstimos", "Venda de imobilizado e compra de intangível", "Recebimento de clientes e salários", "Empréstimo concedido a terceiro e compra de ações de outra entidade"], "correct": 0, "why": ["Ambas as operações dizem respeito à captação ou devolução de recursos financeiros.", "Ambas são de investimento.", "Ambas são operacionais.", "Ambas são, em regra, de investimento."]}, {"q": "Uma entidade obteve R$ 150.000 de empréstimo, amortizou R$ 60.000 do principal e pagou R$ 20.000 a fornecedores. Qual é o fluxo líquido de financiamento dessas operações?", "opts": ["R$ 70.000", "R$ 90.000", "R$ 110.000", "R$ 150.000"], "correct": 1, "why": ["Descontar fornecedores mistura atividade operacional.", "R$ 150.000 menos R$ 60.000 = R$ 90.000; fornecedores não entram no cálculo.", "Inclui indevidamente ou desconsidera saídas de outra classificação.", "Ignora a amortização de R$ 60.000."]}, {"q": "Uma empresa recebeu R$ 120.000 pela emissão de debêntures, pagou R$ 30.000 para resgatar ações próprias e adquiriu máquinas por R$ 50.000. Qual é o fluxo líquido de financiamento?", "opts": ["R$ 40.000", "R$ 70.000", "R$ 90.000", "R$ 120.000"], "correct": 2, "why": ["Desconta indevidamente a compra de máquinas, que é investimento.", "Não corresponde à diferença das duas operações de financiamento.", "R$ 120.000 − R$ 30.000 = R$ 90.000; máquinas são investimento.", "Desconsidera a saída para resgatar ações próprias."]}, {"q": "Assinale a alternativa que corresponde a uma saída de caixa de financiamento segundo o CPC 03 (R2).", "opts": ["Pagamento a empregados", "Compra de mercadorias", "Concessão de empréstimo a terceiro não financeiro", "Redução do passivo de arrendamento pelo arrendatário"], "correct": 3, "why": ["Empregados: atividade operacional.", "Mercadorias: atividade operacional.", "Empréstimo concedido a terceiro, exceto instituição financeira: investimento.", "O pagamento que reduz o passivo de arrendamento é financiamento."]}];

const letters=['A','B','C','D','E'];let page=0;const selected=Array(12).fill(null),confirmed=Array(12).fill(false);

else if(page===1){html='<span class="pill">📘 CPC 03 (R2) — ITEM '+ITEM+'</span><h2>ATIVIDADES DE '+TITLE.toUpperCase()+'</h2><p class="question">Exemplos de fluxos de caixa:</p><ol class="theory" type="a">'+THEORY.map(x=>'<li>'+x+'</li>').join('')+'</ol>'}

}
el.innerHTML=html;document.getElementById('counter').textContent=page===0?'CAPA':page===1?'CPC 03':(page-1)+' / 12';
document.getElementById('back').disabled=page===0;document.getElementById('next').disabled=page===13;
}
function pick(i,j){if(!confirmed[i]){selected[i]=j;render()}}
function confirmAnswer(i){if(selected[i]!==null&&!confirmed[i]){confirmed[i]=true;render()}}
function move(d){page=Math.max(0,Math.min(13,page+d));render();window.scrollTo(0,0)}
function resetQuiz(){if(confirm('Reiniciar o quiz e apagar as respostas?')){selected.fill(null);confirmed.fill(false);page=0;render();window.scrollTo(0,0)}}
render();

 const ctx=canvas.getContext('2d');let tool='cursor',color='#e11d48',width=5,activeStroke=null,painting=false;
 const pages={};let currentPage=0;
 const getPage=()=>typeof page==='number'?page:0;
 function dimensions(){const r=layout.getBoundingClientRect();return {w:Math.max(1,layout.scrollWidth),h:Math.max(1,layout.scrollHeight)};}
 function resize(){const d=dimensions(),ratio=window.devicePixelRatio||1;canvas.style.width=d.w+'px';canvas.style.height=d.h+'px';canvas.width=Math.round(d.w*ratio);canvas.height=Math.round(d.h*ratio);ctx.setTransform(ratio,0,0,ratio,0,0);redraw();}
 function paint(stroke){if(!stroke.points.length)return;ctx.save();ctx.lineJoin='round';ctx.lineCap='round';ctx.lineWidth=stroke.size;ctx.strokeStyle=stroke.color;ctx.globalAlpha=stroke.tool==='highlight'?.38:1;ctx.globalCompositeOperation=stroke.tool==='eraser'?'destination-out':'source-over';ctx.beginPath();stroke.points.forEach((p,i)=>{if(i===0)ctx.moveTo(p.x,p.y);else ctx.lineTo(p.x,p.y)});if(stroke.points.length===1){let p=stroke.points[0];ctx.lineTo(p.x+.01,p.y+.01)}ctx.stroke();ctx.restore();}
 function redraw(){const d=dimensions();ctx.clearRect(0,0,d.w,d.h);(pages[getPage()]||[]).forEach(paint);if(activeStroke)paint(activeStroke);}
 function point(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
 canvas.addEventListener('pointerdown',e=>{if(tool==='cursor')return;e.preventDefault();painting=true;canvas.setPointerCapture(e.pointerId);activeStroke={tool,color,size:tool==='highlight'?Math.max(14,width*3):tool==='eraser'?Math.max(18,width*3):width,points:[point(e)]};redraw()});
 canvas.addEventListener('pointermove',e=>{if(!painting||!activeStroke)return;activeStroke.points.push(point(e));redraw()});
 function end(){if(!painting)return;painting=false;(pages[getPage()]??=[]).push(activeStroke);activeStroke=null;redraw()}
 canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end);
 const bar=document.getElementById('drawTools');
 function selectTool(next){tool=next;canvas.classList.toggle('drawing',tool!=='cursor');bar.querySelectorAll('[data-tool]').forEach(b=>b.classList.toggle('active',b.dataset.tool===tool));}
 bar.querySelectorAll('[data-tool]').forEach(b=>b.addEventListener('click',()=>selectTool(b.dataset.tool)));
 bar.querySelectorAll('[data-color]').forEach(b=>b.addEventListener('click',()=>{color=b.dataset.color;bar.querySelectorAll('[data-color]').forEach(x=>x.classList.toggle('active',x===b));selectTool('pen')}));
 bar.querySelector('[data-color]').classList.add('active');
 document.getElementById('penWidth').addEventListener('input',e=>{width=+e.target.value;document.getElementById('widthValue').textContent=width});
 document.getElementById('undoInk').addEventListener('click',()=>{(pages[getPage()]||[]).pop();redraw()});
 document.getElementById('clearInk').addEventListener('click',()=>{if(confirm('Apagar as anotações desta tela?')){pages[getPage()]=[];redraw()}});
 // As anotações ficam guardadas separadamente em cada tela, mesmo ao navegar.
 const observer=new MutationObserver(()=>{if(currentPage!==getPage()){currentPage=getPage();activeStroke=null;painting=false;}requestAnimationFrame(resize)});
 observer.observe(document.getElementById('content'),{childList:true,subtree:false});
 window.addEventListener('resize',resize);
 document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>setTimeout(resize,0)));
 const oldReset=window.resetQuiz;
 if(typeof oldReset==='function'){window.resetQuiz=function(){const before=getPage();oldReset();if(before!==getPage()){Object.keys(pages).forEach(k=>delete pages[k]);resize()}}}
 requestAnimationFrame(resize);
})();
</script></body></html>
